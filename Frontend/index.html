<!DOCTYPE html>
<html lang="en">
<head>
    <title>Quantity Measurement</title>
    <link rel="stylesheet" href="./styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <h1>Welcome To Quantity Measurement</h1>
</header>

<div class="container">

    <!-- ================= TYPE ================= -->
    <h4>CHOOSE TYPE</h4>
    
    <div class="type-box">
        <div class="card"><img src="../images/length.png"><p>Length</p></div>
        <div class="card"><img src="../images/weight.png"><p>Weight</p></div>
        <div class="card"><img src="../images/temperature.png"><p>Temperature</p></div>
        <div class="card"><img src="../images/volume.png"><p>Volume</p></div>
    </div>

    <!-- ================= ACTION ================= -->
    <h4>CHOOSE ACTION</h4>

    <div class="action-box">
        <button>Comparison</button>
        <button>Conversion</button>
        <button>Arithmetic</button>
    </div>

    <!-- ================= VALUES ================= -->
    <div class="values">

        <!-- FROM -->
        <div class="value">
            <label>FROM</label>
            <div class="combined-box">
                <input type="number" id="from-value" value="1">
                <select id="from-unit"></select>
            </div>
        </div>

        <!-- OPERATOR (UC-13) -->
        <div id="operator-selector" class="operator-container">

        <!-- Selected operator (default +) -->
        <button id="selected-operator" class="operator-btn">+</button>

        <!-- Hidden options -->
        <div id="operator-options" class="operator-options">
            <button class="operator-option">−</button>
            <button class="operator-option">×</button>
            <button class="operator-option">÷</button>
        </div>

        </div>

        <!-- TO -->
        <div class="value">
            <label>TO</label>
            <div class="combined-box">
                <input type="number" id="to-value" value="1">
                <select id="to-unit"></select>
            </div>
        </div>

    </div>

    <!-- ================= RESULT ================= -->
    <div class="result">

        <div class="result-left">
            <span>RESULT</span>
            <h2 id="result-value">—</h2>
        </div>

        <div class="result-right">
            <span id="result-unit"></span>
        </div>

    </div>

</div>

<!-- ================= SCRIPTS ================= -->
<script src="./js/conversion.js"></script>
<script src="./js/api.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/app.js"></script>

</body>
</html>
