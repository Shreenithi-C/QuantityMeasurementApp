<!DOCTYPE html>
<html lang="en">
<head>
    <title>Quantity Measurement</title>
    <link rel="stylesheet" href="./styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <h1>Welcome To Quantity Measurement</h1>
</header>

<div class="container">

    <h4>CHOOSE TYPE</h4>
    
    <div class="type-box">
        <div class="card">
            <img src="../images/length.png">
            <p>Length</p>
        </div>
        <div class="card">
            <img src="../images/weight.png">
            <p>Weight</p>
        </div>
        <div class="card">
            <img src="../images/temperature.png">
            <p>Temperature</p>
        </div>
        <div class="card">
            <img src="../images/volume.png">
            <p>Volume</p>
        </div>
    </div>


    <h4>CHOOSE ACTION</h4>

    <div class="action-box">
        <button>Comparison</button>
        <button>Conversion</button>
        <button>Arithmetic</button>
    </div>


    <div class="values">

        <!-- VALUE 1 -->
        <div class="value">
            <label>FROM</label>

            <div class="combined-box">
                <input type="number" value="1">
                <select>
                    <option>Kilogram</option>
                    <option>Gram</option>
                    <option>Ton</option>
                    <option>Pound</option>
                    <option>Ounce</option>
                </select>
            </div>
        </div>

        <!-- OPERATOR -->
        <div class="operator-container">
            <button class="operator-btn">+</button>
        </div>

        <!-- VALUE 2 -->
        <div class="value">
            <label>TO</label>

            <div class="combined-box">
                <input type="number" value="1">
                <select>
                    <option>Kilogram</option>
                    <option>Gram</option>
                    <option>Ton</option>
                    <option>Pound</option>
                    <option>Ounce</option>
                </select>
            </div>
        </div>

    </div>

</div>
    <script src="./js/conversion.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
